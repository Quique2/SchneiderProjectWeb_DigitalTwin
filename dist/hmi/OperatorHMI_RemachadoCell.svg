<?xml version="1.0" encoding="UTF-8"?>
<!--
  Operator HMI — Celda de Remachado.
  Panel destino: Schneider Harmony ST6 · HMIST6200 · 4.3" Wide · 480 x 272 px (nativo).
  Source: a01769810-svg/HMI-rasp · docs/OperatorHMI_RemachadoCell.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 272" width="480" height="272"
     font-family="'JetBrains Mono','Roboto Mono','Courier New',monospace">
  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="ledGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="480" height="272" fill="#071321"/>
  <rect id="screen_outline" x="1" y="1" width="478" height="270" rx="5" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <text id="title" x="10" y="15" fill="#DDEEFF" font-size="12" font-weight="700" letter-spacing="0.3">Operator HMI — Celda de Remachado</text>
  <line id="title_divider" x1="10" y1="20" x2="470" y2="20" stroke="#1E3A5F" stroke-width="1"/>
  <g id="btn_start" data-element="button" data-tag="HMI.START" data-event="START">
    <rect id="btn_start_rect" x="10" y="24" width="226" height="22" rx="5" fill="#16A34A"/>
    <text x="123" y="35" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" dominant-baseline="central">START</text>
  </g>
  <g id="btn_stop" data-element="button" data-tag="HMI.STOP" data-event="STOP">
    <rect id="btn_stop_rect" x="244" y="24" width="226" height="22" rx="5" fill="#3C4656"/>
    <text x="357" y="35" fill="#AAB8C8" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" dominant-baseline="central">STOP</text>
  </g>
  <g id="btn_resume" data-element="button" data-tag="HMI.RESUME" data-event="RESUME">
    <rect id="btn_resume_rect" x="10" y="50" width="226" height="22" rx="5" fill="#3C4656"/>
    <text x="123" y="61" fill="#AAB8C8" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central">RESUME</text>
  </g>
  <g id="btn_restart" data-element="button" data-tag="HMI.RESTART" data-event="RESTART">
    <rect id="btn_restart_rect" x="244" y="50" width="226" height="22" rx="5" fill="#3C4656"/>
    <text x="357" y="61" fill="#AAB8C8" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central">RESTART</text>
  </g>
  <g id="btn_confirmar_limpieza" data-element="button" data-tag="HMI.CONFIRM_CLEAN" data-event="CONFIRM_CLEAN">
    <rect id="btn_confirmar_limpieza_rect" x="10" y="76" width="226" height="22" rx="5" fill="#3C4656"/>
    <text x="123" y="87" fill="#AAB8C8" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">CONFIRMAR LIMPIEZA</text>
  </g>
  <g id="btn_finalizar" data-element="button" data-tag="HMI.FINALIZE" data-event="FINALIZE">
    <rect id="btn_finalizar_rect" x="244" y="76" width="226" height="22" rx="5" fill="#3C4656"/>
    <text x="357" y="87" fill="#AAB8C8" font-size="10.5" font-weight="600" letter-spacing="1" text-anchor="middle" dominant-baseline="central">FINALIZAR</text>
  </g>
  <rect id="panel_inputs" x="10" y="100" width="460" height="58" rx="6" fill="#0B1726" stroke="#1E3A5F" stroke-width="1.5" filter="url(#panelShadow)"/>
  <text id="title_inputs" x="18" y="113" fill="#6FA8FF" font-size="8" font-weight="700" letter-spacing="2">DIGITAL INPUTS</text>
  <g id="di_conveyor_photoeye" data-element="led-input" data-tag="I_CONVEYOR_PHOTOEYE" data-state="off" data-on-color="#22FF66">
    <circle id="di_conveyor_photoeye_led" cx="35.6" cy="132" r="5" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="35.6" y="145" fill="#8AA7C7" font-size="6" text-anchor="middle">Conveyor</text>
  </g>
  <g id="di_fixture_1_present" data-element="led-input" data-tag="I_FIXTURE_1_PRESENT" data-state="off" data-on-color="#22FF66">
    <circle id="di_fixture_1_present_led" cx="86.7" cy="132" r="5" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="86.7" y="145" fill="#8AA7C7" font-size="6" text-anchor="middle">Fixture 1</text>
  </g>
  <g id="di_fixture_2_present" data-element="led-input" data-tag="I_FIXTURE_2_PRESENT" data-state="off" data-on-color="#22FF66">
    <circle id="di_fixture_2_present_led" cx="137.8" cy="132" r="5" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="137.8" y="145" fill="#8AA7C7" font-size="6" text-anchor="middle">Fixture 2</text>
  </g>
  <g id="di_cobot_moving" data-element="led-input" data-tag="I_COBOT_MOVING" data-state="off" data-on-color="#3B8BFF">
    <circle id="di_cobot_moving_led" cx="188.9" cy="132" r="5" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="188.9" y="145" fill="#8AA7C7" font-size="6" text-anchor="middle">Cobot Mov</text>
  </g>
  <g id="di_cobot_ready" data-element="led-input" data-tag="I_COBOT_READY" data-state="on" data-on-color="#22FF66">
    <circle id="di_cobot_ready_glow" cx="240" cy="132" r="7" fill="#22FF66" opacity="0.28" filter="url(#ledGlow)"/>
    <circle id="di_cobot_ready_led" cx="240" cy="132" r="5" fill="#22FF66" stroke="#0AE05A" stroke-width="1" filter="url(#ledGlow)"/>
    <text x="240" y="145" fill="#DDEEFF" font-size="6" text-anchor="middle">Cobot Rdy</text>
  </g>
  <g id="di_gripper_open" data-element="led-input" data-tag="I_GRIPPER_OPEN" data-state="off" data-on-color="#22FF66">
    <circle id="di_gripper_open_led" cx="291.1" cy="132" r="5" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="291.1" y="145" fill="#8AA7C7" font-size="6" text-anchor="middle">Grip Open</text>
  </g>
  <g id="di_gripper_closed" data-element="led-input" data-tag="I_GRIPPER_CLOSED" data-state="off" data-on-color="#22FF66">
    <circle id="di_gripper_closed_led" cx="342.2" cy="132" r="5" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="342.2" y="145" fill="#8AA7C7" font-size="6" text-anchor="middle">Grip Clsd</text>
  </g>
  <rect id="panel_camera" x="10" y="162" width="296" height="42" rx="6" fill="#0B1726" stroke="#1E3A5F" stroke-width="1.5" filter="url(#panelShadow)"/>
  <text id="title_camera" x="18" y="175" fill="#6FA8FF" font-size="8" font-weight="700" letter-spacing="2">CAMERA</text>
  <g id="camera_status" data-element="text-readout" data-tag="CAMERA_STATUS" data-states="READY|PASS|FAIL|NO_READ|ERROR">
    <rect id="camera_status_box" x="64" y="180" width="232" height="18" rx="3" fill="#06101C" stroke="#1E3A5F" stroke-width="1"/>
    <text id="camera_status_label" x="18" y="190" fill="#8AA7C7" font-size="7" dominant-baseline="central">estado:</text>
    <text id="camera_status_value" x="72" y="190" fill="#6FA8FF" font-size="11" font-weight="700" dominant-baseline="central">READY</text>
  </g>
  <rect id="panel_outputs" x="10" y="210" width="296" height="54" rx="6" fill="#0B1726" stroke="#1E3A5F" stroke-width="1.5" filter="url(#panelShadow)"/>
  <text id="title_outputs" x="18" y="223" fill="#6FA8FF" font-size="8" font-weight="700" letter-spacing="2">DIGITAL OUTPUTS</text>
  <g id="do_gripper_off" data-element="led-output" data-tag="O_GRIPPER_OFF" data-state="off" data-on-color="#22FF66">
    <circle id="do_gripper_off_led" cx="39.6" cy="242" r="6" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="39.6" y="257" fill="#8AA7C7" font-size="6.5" text-anchor="middle">Grip Off</text>
  </g>
  <g id="do_conveyor_motor" data-element="led-output" data-tag="O_CONVEYOR_MOTOR" data-state="off" data-on-color="#22FF66">
    <circle id="do_conveyor_motor_led" cx="98.8" cy="242" r="6" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="98.8" y="257" fill="#8AA7C7" font-size="6.5" text-anchor="middle">Conv Motor</text>
  </g>
  <g id="do_camera_trigger" data-element="led-output" data-tag="O_CAMERA_TRIGGER" data-state="off" data-on-color="#3B8BFF">
    <circle id="do_camera_trigger_led" cx="158" cy="242" r="6" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="158" y="257" fill="#8AA7C7" font-size="6.5" text-anchor="middle">Cam Trig</text>
  </g>
  <g id="do_table_nema_moving" data-element="led-output" data-tag="O_TABLE_NEMA_MOVING" data-state="off" data-on-color="#3B8BFF">
    <circle id="do_table_nema_moving_led" cx="217.2" cy="242" r="6" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="217.2" y="257" fill="#8AA7C7" font-size="6.5" text-anchor="middle">Disco</text>
  </g>
  <g id="do_rivet_active" data-element="led-output" data-tag="O_RIVET_ACTIVE" data-state="off" data-on-color="#F97316">
    <circle id="do_rivet_active_led" cx="276.4" cy="242" r="6" fill="#40566F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="276.4" y="257" fill="#8AA7C7" font-size="6.5" text-anchor="middle">Rivet</text>
  </g>
  <rect id="panel_counts" x="312" y="162" width="98" height="102" rx="6" fill="#0B1726" stroke="#1E3A5F" stroke-width="1.5" filter="url(#panelShadow)"/>
  <text id="title_counts" x="320" y="175" fill="#6FA8FF" font-size="8" font-weight="700" letter-spacing="1.5">PRODUCCIÓN</text>
  <g id="count_total" data-element="counter" data-tag="COUNT.total">
    <text x="320" y="197" fill="#8AA7C7" font-size="7.5" dominant-baseline="central">Total</text>
    <text id="count_total_value" x="402" y="197" fill="#DDEEFF" font-size="15" font-weight="700" text-anchor="end" dominant-baseline="central">0</text>
  </g>
  <g id="count_accepted" data-element="counter" data-tag="COUNT.accepted">
    <text x="320" y="223" fill="#8AA7C7" font-size="7.5" dominant-baseline="central">Aceptados</text>
    <text id="count_accepted_value" x="402" y="223" fill="#22FF66" font-size="15" font-weight="700" text-anchor="end" dominant-baseline="central">0</text>
  </g>
  <g id="count_rejected" data-element="counter" data-tag="COUNT.rejected">
    <text x="320" y="249" fill="#8AA7C7" font-size="7.5" dominant-baseline="central">Rechazados</text>
    <text id="count_rejected_value" x="402" y="249" fill="#FF5566" font-size="15" font-weight="700" text-anchor="end" dominant-baseline="central">0</text>
  </g>
  <text id="stacklight_label" x="440" y="170" fill="#6FA8FF" font-size="7.5" font-weight="700" letter-spacing="1" text-anchor="middle">STACKLIGHT</text>
  <rect id="stacklight_housing" x="418" y="176" width="44" height="84" rx="9" fill="#0A0F17" stroke="#1E3A5F" stroke-width="1.5"/>
  <g id="do_stacklight_red" data-element="led-output" data-tag="O_STACKLIGHT_RED" data-state="off" data-on-color="#FF3B3B">
    <circle id="do_stacklight_red_led" cx="440" cy="196" r="11" fill="#40566F" stroke="#1E3A5F" stroke-width="1.5"/>
  </g>
  <g id="do_stacklight_yellow" data-element="led-output" data-tag="O_STACKLIGHT_YELLOW" data-state="off" data-on-color="#FBBF24">
    <circle id="do_stacklight_yellow_led" cx="440" cy="218" r="11" fill="#40566F" stroke="#1E3A5F" stroke-width="1.5"/>
  </g>
  <g id="do_stacklight_green" data-element="led-output" data-tag="O_STACKLIGHT_GREEN" data-state="off" data-on-color="#22FF66">
    <circle id="do_stacklight_green_led" cx="440" cy="240" r="11" fill="#40566F" stroke="#1E3A5F" stroke-width="1.5"/>
  </g>
</svg>
